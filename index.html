<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VU Student Help Website — Every VU problem, one friendly home</title>
<meta name="description" content="A student help website for Virtual University students: FAQ top 50, notes organizer, routine builder, degree progress, exam centres, freshman guide, course reviews, GDB drafter, datesheet scheduler, quiz practice, CGPA planner, past papers guide, stories and health desk.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  // Theme: stored choice wins, otherwise the system preference.
  try {
    var t = localStorage.getItem('vuhelp.theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <button type="button" class="btn-ghost btn-sm menu-btn" id="menuBtn" aria-expanded="false" aria-label="Toggle navigation menu"><span aria-hidden="true">☰</span><span class="menu-label"> Menu</span></button>
    <a href="#/home" class="brand" aria-label="VU Help Desk — home"><span class="brand-icon" aria-hidden="true">🎓</span><span class="brand-text"><b>VU Help Desk</b><small>Every VU problem, one friendly home</small></span></a>
    <nav class="topnav" aria-label="Top navigation">
      <button type="button" data-go="home" data-nav="home">Home</button>
      <button type="button" data-go="subject" data-nav="subject">Subjects</button>
      <button type="button" data-go="home" data-nav="tools">Tools</button>
      <button type="button" data-go="faq" data-nav="faq">FAQ</button>
      <button type="button" data-go="centres" data-nav="centres">Exam Centres</button>
    </nav>
    <div class="header-search" role="search">
      <label class="sr-only" for="siteSearch">Search the site</label>
      <input id="siteSearch" type="search" placeholder="Search the site — tools, FAQ, subjects…" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <button type="button" class="btn-ghost btn-sm" id="themeBtn" aria-label="Switch light or dark mode"><span aria-hidden="true">◐</span><span class="theme-label"> Theme</span></button>
    <span id="profileBtn"></span>
  </div>
  <div class="mobile-menu" id="mobileMenu" hidden></div>
</header>
<div class="wrap layout">
  <aside class="side" aria-label="Main navigation">
    <div class="card" style="padding:16px" id="sideNav"></div>
    <div class="side-note">
      <h3 class="font-display">New to VU?</h3>
      <p style="margin-top:4px;font-size:.9rem;opacity:.85">The Freshman Guide walks you from admission to your first result, step by step.</p>
      <button type="button" class="btn-amber" style="width:100%;margin-top:12px" data-go="guide">Start the guide</button>
    </div>
  </aside>
  <main id="app" aria-live="polite"></main>
</div>
<nav class="bottom" aria-label="Quick navigation">
  <div class="row" id="bottomNav"></div>
</nav>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
